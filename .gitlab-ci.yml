workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "beta"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-beta\.\d+)?$/'
    - when: never

stages:
  - package
  - release

package-linux-amd64:
  stage: package
  image: golang:1.26-alpine
  script:
    - mkdir -p dist/package
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/package/orp-node-agent ./cmd/orp-node-agent
    - cp README.md LICENSE deploy/orp-node-agent.example.json dist/package/
    - cp -R deploy/systemd docs dist/package/
    - tar -C dist/package -czf "dist/orp-node-agent-linux-amd64-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}.tar.gz" .
  artifacts:
    name: "orp-node-agent-linux-amd64-$CI_COMMIT_REF_SLUG"
    paths:
      - dist/orp-node-agent-linux-amd64-*.tar.gz
    expire_in: never
  rules:
    - if: '$CI_COMMIT_BRANCH == "beta"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-beta\.\d+)?$/'

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs: [package-linux-amd64]
  script:
    - echo "Publishing Linux amd64 package for $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "ORP Node Agent $CI_COMMIT_TAG"
    description: "Linux amd64 binary package for the mTLS node Agent."
    assets:
      links:
        - name: Linux amd64 package
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/orp-node-agent-linux-amd64-$CI_COMMIT_TAG.tar.gz?job=package-linux-amd64"
          filepath: "/orp-node-agent-linux-amd64.tar.gz"
          link_type: package
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-beta\.\d+)?$/'
